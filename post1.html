<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farah Space - Motivation Quotes</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg-dark: #0f1115; --card-dark: #161920; --gold: #ffb703; --text-light: #e5e7eb; }
        body { background-color: var(--bg-dark); color: var(--text-light); font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; }

        nav a { color: #9ca3af; text-decoration: none; margin: 0 15px; }
        .container { max-width: 800px; margin: 50px auto; padding: 0 20px; }
        .quote-card { background-color: var(--card-dark); border-left: 5px solid var(--gold); padding: 30px; border-radius: 8px; margin-bottom: 30px; }
        .quote-text { font-family: 'Cinzel', serif; font-size: 1.4rem; color: #ffffff; margin-bottom: 15px; line-height: 1.4; }
        .quote-author { color: var(--gold); text-align: right; font-size: 0.95rem; font-weight: 600; }
        .back-btn { display: inline-block; margin-bottom: 30px; color: var(--gold); text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">☀️ FARAHSPACE</a>
        <nav><a href="index.html">Home</a></nav>

        <div class="quote-card">
            <div class="quote-text">"Stethoscope aur White Apron khairat me nahi milte, inhein kamana padta hai apni raaton ki neend bech kar."</div>
            <div class="quote-author">— Medical Motivation</div>
        </div>
    </div>
</body>
</html>
